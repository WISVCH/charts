fullnameOverride: ""
replicaCount: 1
serviceAccountName: dienst2

domain: dienst2.ch.tudelft.nl

image:
  repository: ghcr.io/wisvch/dienst2
  tag: latest
  pullPolicy: IfNotPresent
  pullSecrets: {}

resources:
  limits:
    memory: 512Mi
  requests:
    cpu: 50m
    memory: 150Mi

allowedHosts: "*"

cache:
  url: locmemcache://
iap:
  expected_audience: ""

postgres:
  username: ""
  password: ""
  host: ""
  port: 5432
  database: dienst2
  cloudSQL: true
  cloudSQLProxy:
    image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.13.0
    instanceConnectionName: wisvch:europe-west4:geurt
    resources:
      limits:
        memory: 200Mi
      requests:
        cpu: 20m
        memory: 100Mi

secret_key: ""

serviceAccountSecretName: ""
serviceAccountSecretKey: ""
