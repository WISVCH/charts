---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dienst2.fullname" . }}
  labels:
    {{- include "dienst2.labels" . | nindent 4 }}
spec:
  replicas: {{ .replicaCount }}
  selector:
    matchLabels:
      run: dienst2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        run: dienst2
    spec:
      serviceAccountName: {{ .Values.serviceAccountName | quote }}
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        - name: service-account-key
          secret:
            secretName: {{ .Values.serviceAccountSecretName }}
            items:
              - key: {{ .Values.serviceAccountSecretKey }}
                path: google-service-account.json
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
              scheme: HTTP
              httpHeaders:
                - name: Host
                  value: {{ .Values.domain | quote }}
            initialDelaySeconds: 15
            periodSeconds: 20
            successThreshold: 1
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
              scheme: HTTP
              httpHeaders:
                - name: Host
                  value: {{ .Values.domain | quote }}
            initialDelaySeconds: 15
            periodSeconds: 20
            successThreshold: 1
            timeoutSeconds: 5
          env:
            - name: ALLOWED_HOSTS
              value: {{ .Values.allowedHosts | quote }}
            - name: CACHE_URL
              value: {{ .Values.cache.url | quote }}
            - name: DATABASE_URL
              value: postgresql://{{.Values.postgres.username}}:{{.Values.postgres.password}}@{{.Values.postgres.host}}:{{.Values.postgres.port}}/{{.Values.postgres.database}}
            - name: INTERNAL_IPS
              value: ""
            - name: GOOGLE_IAP_AUDIENCE
              value: {{ .Values.iap.expected_audience | quote }}
            - name: SECRET_KEY
              value: {{.Values.secret_key | quote }}
            - name: GOOGLE_SERVICE_ACCOUNT_DELEGATED_USER
              value: "root@ch.tudelft.nl"
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - mountPath: /srv/google-service-account.json
              name: service-account-key
              subPath: google-service-account.json
              readOnly: true
        {{- if eq .Values.postgres.cloudSQL true }}
        - name: cloud-sql-proxy
          image: {{ .Values.postgres.cloudSQLProxy.image | quote }}
          args:
            - "--auto-iam-authn"
            - "--structured-logs"
            - "--private-ip"
            - "--port={{.Values.postgres.port}}"
            - {{ .Values.postgres.cloudSQLProxy.instanceConnectionName | quote }}
          securityContext:
            runAsNonRoot: true
          resources:
            {{- toYaml .Values.postgres.cloudSQLProxy.resources | nindent 12 }}
          {{- end}}
